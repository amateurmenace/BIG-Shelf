# Fly.io configuration for the BIG Equipment Library (self-hosted shelf.nu).
# Build context is the monorepo root; the Dockerfile uses `turbo prune` to
# produce a minimal @shelf/webapp image. App listens on PORT=8080 (set in the
# Dockerfile). See https://fly.io/docs/reference/configuration/.
app = "big-shelf"
primary_region = "sjc" # San Jose, CA — co-located with the Supabase DB (AWS us-west-2, Oregon) to cut per-query latency ~70ms → ~15ms

[build]
  dockerfile = "apps/webapp/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm (no cold starts) now that this is in real
  # production use; any extra machines still auto-stop when idle.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
